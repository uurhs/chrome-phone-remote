name: Windows portable ZIP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install application and build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Run source checks
        run: python -m unittest discover -s tests -v
      - name: Build portable ZIP
        run: python build_windows.py
      - name: Smoke test packaged executable
        run: python smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-phone-remote-windows-beta
          path: dist/chrome-phone-remote-windows-beta.zip
          if-no-files-found: error
