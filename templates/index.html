<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chrome Phone Remote</title>
<link rel="stylesheet" href="/static/style.css"></head><body>
<div id="pair"><h2>スマホを接続</h2><p>PCの黒い画面に表示された接続コードを入力してください。</p><input id="code" placeholder="6-digit code" inputmode="numeric" maxlength="6"><button id="pairButton">接続</button><p id="pairError"></p></div>
<div id="remote"><header><select id="tabs" aria-label="タブ"></select><button id="refreshTabs">タブ更新</button></header><div class="controls"><select id="quality" aria-label="映像品質 / Video quality"><option value="low">軽量 / Low</option><option value="balanced" selected>標準 / Balanced</option><option value="high">高画質 / High</option><option value="off">音量操作のみ / Audio controls only</option></select><button id="reconnect">再接続 / Reconnect</button></div><div id="stage"><img id="screen" alt="Chromeページ映像"></div><div id="status">接続中…</div>
<div class="controls"><button id="zoomOut">－</button><button id="zoomReset">100%</button><button id="zoomIn">＋</button><button id="mode">操作: スクロール</button></div>
<div class="controls"><button data-action="back">◀ 戻る</button><button data-action="forward">進む ▶</button><button data-action="reload">↻ 更新</button><button data-action="new">＋ 新規タブ</button></div><div class="controls"><input id="url" type="url" placeholder="URL または検索語"><button id="go">移動</button></div><div class="controls"><input id="text" type="text" placeholder="クリックした入力欄へ文字を送る"><button id="type">入力</button><button id="enter">Enter</button></div><div class="controls" id="volumeControls"><div class="mediaRow"><button id="seekBack">−10s</button><button id="playPause">▶ / Ⅱ</button><button id="seekForward">+10s</button><button id="volumeDown">−5%</button><button id="volumeUp">+5%</button></div><button id="mute" aria-label="ミュート">🔊</button><input id="volume" aria-label="動画の音量" type="range" min="0" max="100" value="50" disabled><span id="volumeValue">--%</span></div></div>
<script src="/static/remote.js" defer></script></body></html>
